<!DOCTYPE html>
<html lang="en">

<head>
    <div id="top-spacing-line"></div>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/experiences.css">
    <title>Experiences</title>

    <script src="scripts/theme.js" defer></script>
    <script src="scripts/mute.js" defer></script>
    <script src="scripts/sound.js"></script>
    <script src="scripts/cookies.js" defer></script>
    <script src="scripts/scroll.js" defer></script>
    <script src="scripts/contact.js" defer></script>
    <script src="scripts/media_switcher.js"></script>
</head>


<body>

    <div id="wrapper">

    <header>

        <nav id="top-navbar">
            <ul>
                <li><a href="index.html">Homepage</a></li>
                <li><a href="about.html">About the Game</a></li>
                <li><a href="mechanics.html">Game Mechanics</a></li>
                <li class="active"><a href="experiences.html">My Experiences</a></li>
            </ul>
        </nav>

        <section id="button-section">
            <button onclick="toggleTheme()">Toggle Theme</button>

            <button onclick="toggleMute()">Mute Sound</button>

            <button onclick="showContactForm()">Contact Me Here</button>

        </section>

    </header>

    <main id="content">

        <h1>Some of my creations! - Click on the picture to switch.</h1>

        <div id="plane-creation"></div>

        <script>
        media_switcher("left",
            "plane",
            "plane-creation");
        </script>

        <div id="tracked-creation"></div>

        <script>
        media_switcher("right",
            "tracked-L1",
            "tracked-creation");
        </script>

        <div id="boat"></div>

        <script>
        media_switcher("left",
            "career-boat",
            "boat");
        </script>

    </main>

    <footer>
        <Button id="manage-cookies-btn" style="border-radius: 15px; border-width: 5px; border-style: outset;">
                    Click here to manage Cookies!</Button>
        <p id="cookies-choice-footer">Here the choice of your cookies should be shown!</p>

        <h3>Thanks for reading this page! Make sure to check out all the other pages</h1>
        <p>&copy; Simon Karlsson 2026</p>
    </footer>

    </div>

    <button id="scroll-up-btn">Scroll to Top</button>

    <div id="contact-box" class="hidden">
        <h3>Contact Us</h3>
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>

        <button onclick="sendAndClose()">Send</button>
        <button onclick="hideContactForm()">Close</button>
    </div>

</body>

</html>
